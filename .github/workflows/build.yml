name: 대시보드 자동 갱신

on:
  schedule:
    - cron: '0 19 * * *'        # 매일 04:00 (한국시간)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['meta.json', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 수집 및 색인
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json search-index.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
